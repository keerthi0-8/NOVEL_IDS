
schema_version: 1

datasets:
  nsl_kdd:
    feature_count: 41
    label_column: 41
    excluded_columns:
      - difficulty

  unsw_nb15:
    feature_count: 42
    excluded_columns:
      - id
      - attack_cat
      - label

common_features:
  - semantic_id: flow_duration
    nsl_kdd: duration
    unsw_nb15: dur
    relationship: equivalent
    confidence: high
    description: Duration of the network connection or flow.
    notes: Both are numeric duration measurements; verify units and account for different precision and distributions.

  - semantic_id: transport_protocol
    nsl_kdd: protocol_type
    unsw_nb15: proto
    relationship: equivalent
    confidence: high
    description: Network transport protocol used by the connection.
    notes: Only some category values overlap; preserve dataset-specific protocol categories.

  - semantic_id: network_service
    nsl_kdd: service
    unsw_nb15: service
    relationship: equivalent
    confidence: high
    description: Network service associated with the connection.
    notes: Category vocabularies differ substantially; preserve original categories and semantic identities.

  - semantic_id: source_to_destination_bytes
    nsl_kdd: src_bytes
    unsw_nb15: sbytes
    relationship: equivalent
    confidence: high
    description: Bytes transferred from source to destination.
    notes: Both represent byte counts; distributions are highly skewed and require suitable transformation.

  - semantic_id: destination_to_source_bytes
    nsl_kdd: dst_bytes
    unsw_nb15: dbytes
    relationship: equivalent
    confidence: high
    description: Bytes transferred from destination to source.
    notes: Both represent byte counts; distributions are highly skewed and require suitable transformation.

mapping_policy:
  unlisted_features: dataset_specific
  uncertain_matches: require_review
  preserve_dataset_specific_features: true
  force_incompatible_alignment: false
  retain_original_feature_names: true
