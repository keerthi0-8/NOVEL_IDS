schema_version: 1
dataset: CIC-DDoS2019
source_url: https://www.unb.ca/cic/datasets/ddos-2019.html
feature_documentation:
- https://github.com/jordan178169/CICFlowMeter/blob/master/ReadMe.txt
- https://github.com/ahlashkari/CICFlowMeter/blob/master/src/main/java/cic/cs/unb/ca/jnetpcap/FlowFeature.java
transform_definitions:
  microseconds_to_seconds: Divide time values by 1,000,000; CICFlowMeter duration/IAT/active/idle
    measurements are in microseconds.
  iana_protocol_to_name: Map IANA IP protocol numbers to names (1=icmp, 6=tcp, 17=udp,
    47=gre, 50=esp, 58=ipv6-icmp); preserve other values as protocol_<number>.
features:
  Flow ID:
    description: Bidirectional flow identifier derived from endpoint tuple and protocol
    unit: identifier
    network_meaning: Flow key; not an attack feature
    data_type: symbolic
    mapping:
      level: 3
      relationship: dataset_specific
      confidence: unassessed
      unit_compatible: false
      type_compatible: false
      declared_transform: null
      evidence: No clear source semantic equivalent or approved group-level match;
        retained as dataset-specific.
    value_transform: null
  ' Source IP':
    description: Source IP address of the forward direction
    unit: address
    network_meaning: Origin endpoint address
    data_type: symbolic
    mapping:
      level: 3
